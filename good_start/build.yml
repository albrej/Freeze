name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Installer buildozer
        run: pip install buildozer==1.5.0 cython==0.29.36 setuptools

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Vérifier Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Build de l'APK
        run: |
          for i in 1 2 3; do
            buildozer -v android debug && exit 0
            echo "Tentative $i échouée, nouvelle tentative dans 20 s..."
            sleep 20
          done
          exit 1

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: freeze-screen-apk
          path: bin/*.apk