name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation des dépendances
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake m4 libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install "pip==23.3.2" "setuptools==68.0.0" wheel
          pip install "cython<3.1" buildozer "https://github.com/kivy/python-for-android/archive/refs/heads/master.zip"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-py311-${{ hashFiles('buildozer.spec') }}-v2

      - name: Build de l'APK
        run: buildozer -v android debug

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: freeze-screen-apk
          path: bin/*.apk
