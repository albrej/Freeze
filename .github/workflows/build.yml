name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances système
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake build-essential
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Préparer l'environnement Python et installer Buildozer
        run: |
          python -m pip install --upgrade "pip<24.1" setuptools wheel
          pip install "Cython<3.0" virtualenv buildozer

      - name: Vérifier la syntaxe Python
        run: |
          python -m py_compile main.py

      - name: Restaurer le cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compiler l'APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Afficher la fin du log en cas d'échec
        if: failure()
        run: |
          grep -n -m 20 -iE "error|traceback|failed|not found|no such file" build.log || true
          echo "-----"
          grep -v "^#     " build.log | tail -n 80

      - name: Envoyer le log complet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: freeze-screen-apk
          path: bin/*.apk
