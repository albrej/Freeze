jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake m4 libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install buildozer cython
          libtoolize --install --force --quiet 2>/dev/null || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 33
          build-tools-version: 33.0.0
          ndk-version: 25.1.8937393

      - name: Cache Buildozer (accélère les builds suivants)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-v3
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Build de l'APK
        run: buildozer -v android debug

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: freeze-screen-apk
          path: bin/*.apk
