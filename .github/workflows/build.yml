name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Installer buildozer
        run: pip install buildozer==1.5.0 cython==0.29.36 setuptools

      - name: Build de l'APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: freeze-screen-apk
          path: bin/*.apk
